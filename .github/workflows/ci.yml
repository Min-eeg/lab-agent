name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单元测试
    runs-on: ubuntu-latest

    services:
      # 单元测试用 FakeDB 替身，不连真实库；
      # 这里起MySQL 是为了让导入链和集成冒烟测试也能跑
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: lab_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 单元测试（不依赖数据库与大模型）
        run: python -m pytest tests -v

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci

      # 构建失败通常意味着有缺失导入或语法错误，等于免费的静态检查
      - name: 构建校验（缺失导出会在这里暴露）
        run: npm run build