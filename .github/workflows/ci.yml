name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单元测试
    runs-on: ubuntu-latest

    # 不起 MySQL: 单元测试全部用 FakeDB 替身，不连真实库。
    # 好处是 CI 不依赖任何外部服务，2 分钟内跑完，也不会有偶发连接失败。

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # .env 被 gitignore 排除（密钥不能进仓库），CI 上不存在这个文件。
      # 单元测试用FakeDB 替身、不连库也不调大模型，这里给占位值让配置能加载。
      - name: 注入占位环境变量（无 .env 环境下让配置可加载）
        env:
          DATABASE_URL: mysql+pymysql://root:password@localhost:3306/lab_agent?charset=utf8mb4
          JWT_SECRET_KEY: ci-only-insecure-secret
          LLM_API_KEY: ci-placeholder
          LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          LLM_MODEL: qwen-plus
        run: echo "env 已注入"

      - name: 单元测试（不依赖数据库与大模型）
        run: python -m pytest tests -v

  frontend-build:
    name: 前端构建校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci

      # 构建失败通常意味着有缺失导入或语法错误，等于免费的静态检查
      - name: 构建校验（缺失导出会在这里暴露）
        run: npm run build