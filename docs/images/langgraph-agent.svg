<text x="832" y="88" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1f2d3d" text-anchor="middle" font-weight="bold">工具集（5 个）</text>
<text x="716" y="120" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5a6b7b" text-anchor="start" font-weight="normal">· get_today 换算今天/明天</text>
<text x="716" y="146" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5a6b7b" text-anchor="start" font-weight="normal">· list_open_labs 查开放实验室</text>
<text x="716" y="172" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5a6b7b" text-anchor="start" font-weight="normal">· list_lab_equipments 查设备</text>
<text x="716" y="198" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5a6b7b" text-anchor="start" font-weight="normal">· search_lab_docs 检索知识库</text>
<text x="716" y="224" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5a6b7b" text-anchor="start" font-weight="normal">· create_lab_reservation 写预约落库</text>
<rect x="60" y="330" width="560" height="60" rx="8" fill="#fdf6e3" stroke="#e8d49a" stroke-width="1.2"/>
<text x="340" y="355" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#7a5b12" text-anchor="middle" font-weight="normal">recursion_limit 限制 agent ⇄ tools 来回次数，防止模型空转；</text>
<text x="340" y="376" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#7a5b12" text-anchor="middle" font-weight="normal">工具失败返回 ok:false，系统提示词要求模型如实转述，禁止谎报成功</text>
</svg>
